<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Inventory System</title>
    <style>
        :root {
            --primary: #2563eb;
            --secondary: #64748b;
            --danger: #ef4444;
            --success: #22c55e;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        .card {
            background: var(--card);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            margin-bottom: 20px;
        }
        h2 { margin-top: 0; }
        input, select, button {
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            font-size: 16px;
        }
        input:focus { outline: 2px solid var(--primary); border-color: transparent; }
        button {
            background-color: var(--primary);
            color: white;
            border: none;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
        button.secondary { background-color: var(--secondary); }
        button.danger { background-color: var(--danger); }
        button.success { background-color: var(--success); }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        .folder-card {
            background: #e2e8f0;
            padding: 15px;
            border-radius: 6px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .folder-card:hover { transform: scale(1.02); }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid #e2e8f0;
        }
        th { background-color: #f1f5f9; }
        .hidden { display: none !important; }
        .auth-form {
            max-width: 400px;
            margin: 100px auto auto auto;
            text-align: center;
        }
        .auth-form input {
            display: block;
            width: 100%;
            margin-bottom: 15px;
            box-sizing: border-box;
        }
        .auth-form button { width: 100%; }
        .alert-box {
            background: #fee2e2;
            border: 1px solid #fecaca;
            color: #b91c1c;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Auth Section -->
    <div id="auth-section" class="card auth-form">
        <h2 id="auth-title">Login</h2>
        <input type="email" id="email" placeholder="Email Address">
        <input type="password" id="password" placeholder="Password">
        <button id="auth-btn" onclick="handleAuth()">Login</button>
        <p style="margin-top: 15px; font-size: 14px;">
            <a href="#" id="auth-toggle" onclick="toggleAuth()">Don't have an account? Create one.</a>
        </p>
    </div>

    <!-- App Section -->
    <div id="app-section" class="hidden">
        
        <!-- Header -->
        <div class="card" style="display: flex; justify-content: space-between; align-items: center;">
            <h2>Inventory Dashboard</h2>
            <div>
                <input type="text" id="search-bar" placeholder="Search parts (e.g. Oppo A5s)" oninput="searchParts()">
                <button class="secondary" onclick="logout()">Logout</button>
            </div>
        </div>

        <!-- Low Stock Alerts -->
        <div id="alert-container"></div>

        <!-- Folders/Boxes -->
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h3>Categories / Boxes</h3>
                <div>
                    <input type="text" id="new-box-name" placeholder="Box Name">
                    <button onclick="addNewBox()">Add Box</button>
                </div>
            </div>
            <div id="box-grid" class="grid"></div>
        </div>

        <!-- Inventory Inside Selected Box -->
        <div id="inventory-card" class="card hidden">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h3 id="current-box-title">Box Inventory</h3>
                <div>
                    <input type="text" id="item-name" placeholder="Part Name">
                    <input type="number" id="item-price" placeholder="Price">
                    <input type="number" id="item-qty" placeholder="Quantity">
                    <button class="success" onclick="addNewItem()">Add Item</button>
                    <button class="danger" onclick="deleteCurrentBox()">Delete Box</button>
                </div>
            </div>
            <table id="inventory-table">
                <thead>
                    <tr>
                        <th>Part Name</th>
                        <th>Price</th>
                        <th>Quantity</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="inventory-body"></tbody>
            </table>
        </div>

        <!-- Daily Sales History -->
        <div class="card">
            <h3>Daily Sales Report</h3>
            <div style="margin-bottom: 15px;">
                <strong>Total Sales Today:</strong> <span id="daily-total">0</span>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Item</th>
                        <th>Qty Sold</th>
                        <th>Total Price</th>
                    </tr>
                </thead>
                <tbody id="sales-history-body"></tbody>
            </table>
            <button class="secondary" onclick="clearSalesHistory()">Clear Sales History</button>
        </div>

    </div>
</div>

<script>
    // App State
    let users = JSON.parse(localStorage.getItem('users')) || {};
    let currentUser = JSON.parse(localStorage.getItem('currentUser')) || null;
    let boxes = {};
    let salesHistory = [];
    let isLoginMode = true;
    let selectedBoxId = null;

    // DOM Elements
    const authSection = document.getElementById('auth-section');
    const appSection = document.getElementById('app-section');
    const authTitle = document.getElementById('auth-title');
    const authBtn = document.getElementById('auth-btn');
    const authToggle = document.getElementById('auth-toggle');

    // Initialize
    function initApp() {
        if (currentUser) {
            authSection.classList.add('hidden');
            appSection.classList.remove('hidden');
            loadUserData();
            renderBoxes();
            renderSales();
            checkLowStock();
        } else {
            authSection.classList.remove('hidden');
            appSection.classList.add('hidden');
        }
    }

    // Auth Handlers
    function toggleAuth() {
        isLoginMode = !isLoginMode;
        authTitle.innerText = isLoginMode ? 'Login' : 'Create Account';
        authBtn.innerText = isLoginMode ? 'Login' : 'Sign Up';
        authToggle.innerText = isLoginMode ? "Don't have an account? Create one." : "Already have an account? Login.";
    }

    function handleAuth() {
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value.trim();

        if (!email || !password) return alert('Please enter both email and password.');

        if (isLoginMode) {
            if (users[email] && users[email].password === password) {
                currentUser = email;
                localStorage.setItem('currentUser', JSON.stringify(currentUser));
                initApp();
            } else {
                alert('Invalid email or password.');
            }
        } else {
            if (users[email]) {
                alert('User already exists.');
            } else {
                users[email] = { password: password, boxes: {}, sales: [] };
                localStorage.setItem('users', JSON.stringify(users));
                alert('Account created! Please login.');
                toggleAuth();
            }
        }
    }

    function logout() {
        localStorage.removeItem('currentUser');
        currentUser = null;
        initApp();
    }

    // Data Load/Save
    function loadUserData() {
        const userData = users[currentUser];
        boxes = userData.boxes || {};
        salesHistory = userData.sales || [];
    }

    function saveData() {
        users[currentUser].boxes = boxes;
        users[currentUser].sales = salesHistory;
        localStorage.setItem('users', JSON.stringify(users));
        renderBoxes();
        renderSales();
        checkLowStock();
    }

    // Box Handlers
    function addNewBox() {
        const nameInput = document.getElementById('new-box-name');
        const boxName = nameInput.value.trim();
        if (!boxName) return alert('Enter a box name.');
        
        const id = 'box_' + Date.now();
        boxes[id] = { name: boxName, items: [] };
        nameInput.value = '';
        saveData();
    }

    function renderBoxes() {
        const grid = document.getElementById('box-grid');
        grid.innerHTML = '';
        Object.keys(boxes).forEach(id => {
            const div = document.createElement('div');
            div.className = 'folder-card';
            div.innerHTML = <strong>${boxes[id].name}</strong>;
            div.onclick = () => selectBox(id);
            grid.appendChild(div);
        });
    }

    function selectBox(id) {
        selectedBoxId = id;
        document.getElementById('current-box-title').innerText = boxes[id].name;
        document.getElementById('inventory-card').classList.remove('hidden');
        renderInventory();
    }

    function deleteCurrentBox() {
        if (!confirm('Are you sure you want to delete this box and all its contents?')) return;
        delete boxes[selectedBoxId];
        document.getElementById('inventory-card').classList.add('hidden');
        selectedBoxId = null;
        saveData();
    }

    // Inventory Handlers
    function addNewItem() {
        const name = document.getElementById('item-name').value.trim();
        const price = parseFloat(document.getElementById('item-price').value);
        const qty = parseInt(document.getElementById('item-qty').value);

        if (!name || isNaN(price) || isNaN(qty)) return alert('Fill all fields correctly.');

        boxes[selectedBoxId].items.push({ id: 'item_' + Date.now(), name, price, qty });
        document.getElementById('item-name').value = '';
        document.getElementById('item-price').value = '';
        document.getElementById('item-qty').value = '';
        saveData();
        renderInventory();
    }

    function renderInventory() {
        const body = document.getElementById('inventory-body');
        body.innerHTML = '';
        if (!selectedBoxId || !boxes[selectedBoxId]) return;

        boxes[selectedBoxId].items.forEach(item => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${item.name}</td>
                <td>${item.price}</td>
                <td>${item.qty}</td>
                <td>
                    <button class="success" onclick="sellItem('${item.id}')">Sell</button>
                    <button class="danger" onclick="deleteItem('${item.id}')">Delete</button>
                </td>
            `;
            body.appendChild(row);
        });
    }

    function deleteItem(itemId) {
        if (!confirm('Delete this item?')) return;
        boxes[selectedBoxId].items = boxes[selectedBoxId].items.filter(i => i.id !== itemId);
        saveData();
        renderInventory();
    }

    // Sales Handlers
    function sellItem(itemId) {
        let soldItem = null;
        boxes[selectedBoxId].items.forEach(item => {
            if (item.id === itemId) {
                if (item.qty > 0) {
                    item.qty--;
                    soldItem = item;
                } else {
                    alert('Out of stock!');
                }
            }
        });

        if (soldItem) {
            salesHistory.push({
                date: new Date().toLocaleDateString(),
                time: new Date().toLocaleTimeString(),
                itemName: soldItem.name,
                qty: 1,
                totalPrice: soldItem.price
            });
            saveData();
            renderInventory();
        }
    }

    function renderSales() {
        const body = document.getElementById('sales-history-body');
        body.innerHTML = '';
        let today = new Date().toLocaleDateString();
        let totalToday = 0;

        salesHistory.forEach(sale => {
            if (sale.date === today) today += sale.totalPrice;
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${sale.date} ${sale.time}</td>
                <td>${sale.itemName}</td>
                <td>${sale.qty}</td>
                <td>${sale.totalPrice}</td>
            `;
            body.appendChild(row);
        });

        document.getElementById('daily-total').innerText = totalToday;
    }

    function clearSalesHistory() {
        if (!confirm('Clear all sales history?')) return;
        salesHistory = [];
        saveData();
    }

    // Search and Alerts
    function searchParts() {
        const query = document.getElementById('search-bar').value.toLowerCase();
        if (!query) {
            renderBoxes();
            return;
        }

        const grid = document.getElementById('box-grid');
        grid.innerHTML = '';
        let found = false;

        Object.keys(boxes).forEach(boxId => {
            const hasItem = boxes[boxId].items.some(item => item.name.toLowerCase().includes(query));
            if (hasItem) {
                found = true;
                const div = document.createElement('div');
                div.className = 'folder-card';
                div.innerHTML = <strong>${boxes[boxId].name}</strong><br><small style="font-size:12px;">Contains match</small>;
                div.onclick = () => selectBox(boxId);
                grid.appendChild(div);
            }
        });

        if (!found) grid.innerHTML = '<p>No matching parts found.</p>';
    }

    function checkLowStock() {
        const alertContainer = document.getElementById('alert-container');
        alertContainer.innerHTML = '';
        let lowItems = [];

        Object.keys(boxes).forEach(boxId => {
            boxes[boxId].items.forEach(item => {
                if (item.qty <= 2) {
                    lowItems.push(${item.name} in ${boxes[boxId].name} (Qty: ${item.qty}));
                }
            });
        });

        lowItems.forEach(msg => {
            const div = document.createElement('div');
            div.className = 'alert-box';
            div.innerText = 'Low Stock Alert: ' + msg;
            alertContainer.appendChild(div);
        });
    }

    // Initialize on load
    initApp();
</script>

</body>
</html>
